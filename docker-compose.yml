services:
  backend:
    build:
      context: ./BE
    env_file:
      - ./BE/.env
    environment:
      PORT: "8888"
    ports:
      - "8888:8888"
    volumes:
      - ./BE:/app
      - /app/node_modules
    command: sh -c "pnpm install && pnpm prisma generate && pnpm dev"

  frontend:
    build:
      context: ./FE
    environment:
      BACKEND_URL: http://backend:8888
    env_file:
      - path: ./FE/.env
        required: false
    ports:
      - "5173:5173"
    volumes:
      - ./FE:/app
      - /app/node_modules
    depends_on:
      - backend
